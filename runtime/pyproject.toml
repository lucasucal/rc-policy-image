[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rc_runtime"
version = "0.1.0"
description = "Reality-check pinned-image loader and policy server (contract v0)"
requires-python = ">=3.12"
dependencies = ["rc_sdk"]

[tool.setuptools]
packages = ["rc_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
